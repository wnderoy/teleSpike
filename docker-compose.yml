# teleSpike — real Kafka + real PySpark, pinned to the version-lockstep triple:
#   apache/spark:3.5.1          (master/worker)
#   jupyter/pyspark-notebook:spark-3.5.1   (bundled PySpark must match, else NoSuchMethodError)
#   org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1  (passed to --packages at submit)
# Kafka is 3.7.2 KRaft single-node (no ZooKeeper).
#
#   docker compose up -d
#   docker compose exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --topic telegram --partitions 3
#   docker compose exec jupyter spark-submit ... (see notebooks/00_setup.ipynb)

services:
  kafka:
    image: apache/kafka:3.7.2
    container_name: telespike-kafka
    ports:
      - "9092:9092"            # host: PLAINTEXT_HOST
    environment:
      # KRaft combined node (broker + controller in one)
      CLUSTER_ID: "telespike-kraft-cluster-id-0000000000"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # Authoritative readiness: the broker responds to API-version negotiation.
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  spark-master:
    image: apache/spark:3.5.1
    container_name: telespike-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8080:8080"            # Spark UI
      - "7077:7077"            # cluster URL
    volumes:
      - ./warehouse:/opt/warehouse
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  spark-worker:
    image: apache/spark:3.5.1
    container_name: telespike-spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--webui-port", "8081"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 3g
      SPARK_DAEMON_MEMORY: 1g
    ports:
      - "8081:8081"            # worker UI
    volumes:
      - ./warehouse:/opt/warehouse
    depends_on:
      spark-master:
        condition: service_healthy

  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.1
    container_name: telespike-jupyter
    ports:
      - "8888:8888"
    environment:
      # Keep the bundled Spark version visible for sanity checks in 00_setup.ipynb
      SPARK_HOME: /usr/local/spark
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # No auth token so the VM demo "just works"; printed token shows in logs otherwise.
      JUPYTER_TOKEN: ""
      PYSPARK_SUBMIT_ARGS: "--master spark://spark-master:7077 --driver-memory 4g --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1"
    volumes:
      - .:/home/repo             # the whole repo (src/, spark/, config/, notebooks/)
      - ./data:/home/repo/data
      - ./output:/home/repo/output
      - ./warehouse:/opt/warehouse
    working_dir: /home/repo
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy

volumes:
  kafka_data:
